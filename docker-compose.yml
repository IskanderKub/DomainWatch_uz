services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql://domainwatch:domainwatch@postgres:5432/domainwatch
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: domainwatch
    depends_on:
      - postgres
      - mongo

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: domainwatch
      POSTGRES_PASSWORD: domainwatch
      POSTGRES_DB: domainwatch
    ports:
      # bound to the host loopback only: without 127.0.0.1 Docker publishes the port
      # on every interface, so on a public server this database would be reachable
      # from the internet - with the credentials that are in this very file
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      # loopback only, as above - MongoDB here runs with no authentication at all
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  mongo_data:
